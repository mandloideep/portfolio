# Manual deploy: build the Docker image, push to GHCR, tell Dokploy to redeploy.
#
# Run it from GitHub → Actions → "Deploy" → Run workflow.
#
# One-time setup:
#   1. Repo secret DOKPLOY_DEPLOY_WEBHOOK — the Dokploy application's deploy
#      webhook URL. Enable "Auto Deploy" in the service's General tab, then copy
#      the webhook URL from the deployment logs. The Dokploy image tag must be
#      "latest" (matching the tag pushed below) or the webhook returns a
#      "Branch Not Match" error.
#   2. Repo secret DATABASE_URL — prod (unpooled) Postgres connection string.
#      Used by the migration step below. The DB must be reachable from the
#      GitHub runner (Neon is; a VPS-local Postgres is not — see DEPLOYMENT.md
#      for the in-container alternative).
#   3. Dokploy service uses the "Docker" provider with image
#      ghcr.io/mandloideep/portfolio:latest.
#   4. If the GHCR package is private, add registry credentials in Dokploy
#      (username = GitHub username, password = PAT with read:packages) — or make
#      the package public. The first push creates a private package by default.
name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run migrations from the just-built image against the prod DB *before*
      # telling Dokploy to switch to it. Dokploy has no pre-deploy hook, and the
      # DB (Neon) is reachable from the runner. Requires repo secret DATABASE_URL
      # (prod, unpooled connection string).
      - name: Run database migrations
        run: |
          docker run --rm \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            "${{ env.IMAGE }}:${{ github.sha }}" \
            pnpm release:migrate

      - name: Trigger Dokploy redeploy
        run: curl -fsS -X POST "${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}"
