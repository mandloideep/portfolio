services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: portfolio-app-dev
    env_file:
      - .env.development
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/portfolio
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.output
    depends_on:
      db:
        condition: service_healthy
    command: pnpm dev --host 0.0.0.0

  db:
    image: postgres:16-alpine
    container_name: portfolio-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio
    ports:
      - "5432:5432"
    volumes:
      - portfolio-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  portfolio-db-data:
