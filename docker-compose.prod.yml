services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-app-prod
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    ports:
      - "8080:8080"
    # Neon is external — no local `db` service in production.
    # Bring up with:
    #   docker compose -f docker-compose.prod.yml up -d --build
